model:
    llama2_7b_path: './Llama-2-7b-hf'
    kwargs:
        checkpoint_path: './ckpts_streamvlm/ckpts_streamvlm/state_dict.pth.tar'
        strict_checkpoint: False
        bf16: True  # Use bfloat16 for memory efficiency
        xattn_config:
            xattn_type: 'dotprod'
            xattn_block_size: 1
            adapter_insert_layers: "[6, 8, 10, 12, 14, 16, 18, 20, 22]"
            num_of_xattn_heads: 1
        trainable:
            llm: False
            xattn: False
            vision: False
        peft_config:
            r: 32
            lora_alpha: 16
            lora_dropout: 0.05
            target_modules:
                - 'q_proj'
                - 'v_proj'
                - 'k_proj'
                - 'lm_head'

evaluator:
    name: 'live_feedback_streaming'
    kwargs:
        camera_id: 0
        exercise_type: 'squats'
        cnn_weights_path: './ckpts_efficientnet/fitness_ally_hypermodel/efficientnet4Lite_1.8.3.checkpoint'
        max_buffer_frames: 300  # Max preprocessed frames to buffer (50 seconds at 6 fps)
    sampling_kwargs:
        do_sample: False
        temperature: 0.
        max_feedback_length: 64  # Maximum tokens per feedback
        feats_frequency: 6  # Process video at 6 fps (higher than lightweight for smoother streaming)
        frame_preprocess_rate: 6  # Preprocess frames at 6 fps
        min_frames_before_start: 12  # Start generation after 2 seconds of video
