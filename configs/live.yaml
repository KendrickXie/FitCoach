model:
    llama2_7b_path: './Llama-2-7b-hf'
    kwargs:
        checkpoint_path: './ckpts_streamvlm/ckpts_streamvlm/state_dict.pth.tar'
        strict_checkpoint: False
        bf16: True
        xattn_config:
            xattn_type: 'dotprod'
            xattn_block_size: 1
            adapter_insert_layers: "[6, 8, 10, 12, 14, 16, 18, 20, 22]"
            num_of_xattn_heads: 1
        trainable:
            llm: False
            xattn: False
            vision: False
        peft_config:
            r: 32
            lora_alpha: 16
            lora_dropout: 0.05
            target_modules:
                - 'q_proj'
                - 'v_proj'
                - 'k_proj'
                - 'lm_head'

evaluator:
    name: 'live_feedback'
    kwargs:
        camera_id: 0  # Default webcam
        exercise_type: 'squats'  # Default exercise
    sampling_kwargs:
        do_sample: False  # Greedy decoding for more consistent feedback
        temperature: 0.
        max_feedback_length: 128
        feats_frequency: 4  # Extract features at 4 fps
        feedback_interval: 5.0  # Generate feedback every 5 seconds
